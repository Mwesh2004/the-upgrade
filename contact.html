<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Contact — The Upgrade</title>

  <meta
    name="description"
    content="Contact The Upgrade. Send us your questions, suggestions, feedback, or collaboration ideas."
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: #111;
      font-family: "DM Sans", sans-serif;
      line-height: 1.7;
    }

    header {
      background: #111;
      color: #fff;
      padding: 25px 7%;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-family: "Bebas Neue", sans-serif;
      font-size: 32px;
      letter-spacing: 1px;
    }

    main {
      max-width: 900px;
      margin: 70px auto;
      padding: 0 25px;
    }

    h1 {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(48px, 8vw, 80px);
      line-height: 1;
      margin-bottom: 15px;
    }

    .intro {
      color: #666;
      font-size: 18px;
      max-width: 700px;
      margin-bottom: 45px;
    }

    .contact-form {
      display: grid;
      gap: 22px;
      max-width: 700px;
    }

    .form-group {
      display: grid;
      gap: 8px;
    }

    label {
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #ccc;
      background: #fff;
      color: #111;
      font: inherit;
      border-radius: 0;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #111;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
    }

    button {
      width: fit-content;
      padding: 15px 32px;
      border: none;
      background: #111;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: .8;
    }

    .contact-email {
      margin-top: 45px;
      padding-top: 30px;
      border-top: 1px solid #ccc;
    }

    .contact-email a {
      color: #111;
      font-weight: 600;
    }

    footer {
      background: #111;
      color: #aaa;
      text-align: center;
      padding: 30px 20px;
      margin-top: 80px;
      font-size: 14px;
    }

    footer a {
      color: #fff;
      margin: 0 8px;
      text-decoration: none;
    }

    @media (max-width: 600px) {

      main {
        margin: 45px auto;
      }

      h1 {
        font-size: 55px;
      }

      .intro {
        font-size: 16px;
      }

    }

  </style>

</head>


<body>


<header>

  <a href="/">
    THE UPGRADE
  </a>

</header>


<main>

  <h1>
    Contact The Upgrade
  </h1>


  <p class="intro">

    Have a question, suggestion, collaboration idea, feedback,
    or just something you want to say?

    Send us a message.

  </p>


  <!-- ==========================================
       FORMSPREE CONTACT FORM
  =========================================== -->

  <form
    class="contact-form"
    action="https://formspree.io/f/xgawaadl"
    method="POST"
  >


    <div class="form-group">

      <label for="name">
        Name
      </label>

      <input
        id="name"
        type="text"
        name="name"
        placeholder="Your name"
        autocomplete="name"
        required
      >

    </div>


    <div class="form-group">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        name="email"
        placeholder="your@email.com"
        autocomplete="email"
        required
      >

    </div>


    <div class="form-group">

      <label for="subject">
        Subject
      </label>

      <input
        id="subject"
        type="text"
        name="subject"
        placeholder="What is this about?"
        required
      >

    </div>


    <div class="form-group">

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required
      ></textarea>

    </div>


    <!-- Email subject shown in Formspree -->

    <input
      type="hidden"
      name="_subject"
      value="New Contact Message — The Upgrade"
    >


    <button type="submit">
      Send Message →
    </button>


  </form>


  <div class="contact-email">

    <strong>
      Prefer email?
    </strong>

    <p>

      You can also reach The Upgrade directly at:

    </p>

    <a href="mailto:theupgradeke@gmail.com">

      theupgradeke@gmail.com

    </a>

  </div>


</main>


<footer>

  © 2026 The Upgrade ·

  <a href="/privacy">
    Privacy
  </a>

  <a href="/terms">
    Terms
  </a>

  <a href="/disclaimer">
    Disclaimer
  </a>

  <a href="/contact">
    Contact
  </a>

</footer>


</body>
</html>
